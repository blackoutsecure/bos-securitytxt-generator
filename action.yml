name: 'Blackout Secure Security TXT Generator'
description: 'Generate RFC 9116-compliant security.txt for responsible vulnerability disclosure. Automated deployment with GitHub Actions.'
author: 'Blackout Secure'
runs:
  using: 'node20'
  main: 'dist/index.js'
inputs:
  public_dir:
    description: 'Directory to write security.txt (default: dist). File will be placed in .well-known/ subdirectory per RFC 9116.'
    required: false
    default: 'dist'
  site_url:
    description: 'Public base URL of the site, e.g., https://example.com. Used for canonical URI (optional).'
    required: false
  security_contact:
    description: 'Contact method(s) for security vulnerability reports (REQUIRED per RFC 9116 § 2.5.3, unless supplied via config). Comma-separated list. Must be a URI: mailto:, https://, or tel:. Auto-converts emails. Example: security@example.com,https://example.com/security'
    required: false
  security_expires:
    description: 'Expiration date for security.txt validity. Formats: ISO 8601 (2026-12-31T23:59:59Z), days (180d), months (6m), years (1y). Leave empty to use `security_txt.fields.expires` from config (default: 180d).'
    required: false
  security_acknowledgments:
    description: 'Optional: URL(s) to security researchers hall of fame page. Must use https://. Comma-separated for multiple.'
    required: false
  security_canonical:
    description: 'Optional: Canonical URI(s) where this file is located. Must use https://. Auto-generated from site_url if not provided. Comma-separated for multiple.'
    required: false
  security_encryption:
    description: 'Optional: URL(s) to OpenPGP encryption key for secure communication. Must use https:// or openpgp4fpr: scheme. Comma-separated for multiple.'
    required: false
  security_hiring:
    description: 'Optional: URL(s) to security-related job postings. Must use https://. Comma-separated for multiple.'
    required: false
  security_policy:
    description: 'Optional: URL(s) to vulnerability disclosure policy page. Must use https://. Comma-separated for multiple.'
    required: false
  security_preferred_languages:
    description: 'Optional: Comma-separated language codes for preferred report languages (e.g., "en, es, fr"). Uses RFC 5646 language tags.'
    required: false
  security_comments:
    description: 'Include RFC 9116 reference comments at the top of security.txt. Leave empty to use `security_txt.generate.include_comments` from config.'
    required: false
  write_root_fallback:
    description: 'Also write a legacy copy at <public_dir>/security.txt for pre-RFC-9116 crawlers. Leave empty to use `security_txt.generate.write_root_fallback` from config.'
    required: false
  upload_artifacts:
    description: 'Upload generated security.txt as GitHub artifacts'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name of the GitHub artifact when upload_artifacts is enabled'
    required: false
    default: 'securitytxt'
  artifact_retention_days:
    description: 'Number of days to retain the artifact (1-90). Leave empty for default (35 days)'
    required: false
  debug:
    description: 'Debug: Display generated security.txt content'
    required: false
    default: 'false'
  config_path:
    description: 'Explicit repository config file. Leave empty to auto-discover `.github/bos-universal-config.json|yml`, `bos-universal-config.*`, or `.bos-securitytxt.yml` under the workspace root.'
    required: false
  global_config_path:
    description: 'Organization-level global config path, merged beneath the repository config.'
    required: false
    default: '.github/blackout-secure-securitytxt-generator-global-config.yml'
  use_global_config:
    description: 'Global config tier: auto (load when present), true (require it), or false (disable discovery).'
    required: false
    default: 'auto'
  use_marketplace_config:
    description: 'Apply the bundled marketplace baseline config as the lowest precedence tier.'
    required: false
    default: 'true'
  enable_audit:
    description: 'Run the RFC 9116 compliance audit after generation. Rule severities come from `security_txt.audit.rules` in config.'
    required: false
    default: 'true'
  audit_fail_on:
    description: 'Audit exit policy: fail (non-zero on any fail/error finding) or never. Leave empty to use `security_txt.audit.fail_on` from config.'
    required: false
  sarif_output:
    description: 'Path to write audit findings as SARIF 2.1.0 for GitHub code scanning upload. Empty disables SARIF output.'
    required: false
  report_json:
    description: 'Path to write the machine-readable JSON audit report. Empty disables the report.'
    required: false
  recommendations_json:
    description: 'Path to write structured remediation recommendations for non-pass findings. Empty disables the sidecar.'
    required: false
  skips_json:
    description: 'Path to write the skipped-controls sidecar. SARIF drops `skip` findings, so this is the only machine-readable record of unassessed controls.'
    required: false
  step_summary:
    description: 'Append the Markdown audit report to $GITHUB_STEP_SUMMARY.'
    required: false
    default: 'true'
  enable_ai_summary:
    description: 'Generate a short natural-language findings summary. Falls back to a deterministic local summary when no provider is available.'
    required: false
    default: 'true'
  ai_provider:
    description: 'AI summary provider: auto (GitHub Models when a token is present), none, or a named provider backed by <NAME>_API_KEY and <NAME>_API_ENDPOINT.'
    required: false
    default: 'auto'
outputs:
  security_path:
    description: 'Path to the generated security.txt'
  security_root_path:
    description: 'Path to the legacy root copy, when write_root_fallback is enabled'
  security_expires:
    description: 'Resolved Expires value written to the file'
  config_sources:
    description: 'Comma-separated list of the applied config tiers, in precedence order'
  audit_verdict:
    description: 'Overall audit verdict: Pass, Review recommended, Action required, Inconclusive, or Not assessed'
  audit_pass_count:
    description: 'Number of audit controls that passed'
  audit_warn_count:
    description: 'Number of audit controls that produced a warning'
  audit_fail_count:
    description: 'Number of audit controls that failed'
  audit_error_count:
    description: 'Number of audit controls that could not be evaluated'
  audit_skip_count:
    description: 'Number of audit controls that were not assessed'
  sarif_path:
    description: 'Path to the written SARIF file, when sarif_output is set'
  report_json_path:
    description: 'Path to the written JSON audit report, when report_json is set'
  recommendations_json_path:
    description: 'Path to the written recommendations sidecar, when recommendations_json is set'
  ai_summary:
    description: 'Short natural-language summary of the audit findings'
branding:
  color: 'blue'
  icon: 'shield'
